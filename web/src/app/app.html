@if (loading()) {
  <div class="state">
    <div class="spinner"></div>
    <p>{{ t('state.loading') }}</p>
  </div>
} @else if (error(); as err) {
  <div class="state error">
    <h2>{{ t('state.errorTitle') }}</h2>
    <p>{{ err }}</p>
  </div>
} @else if (route(); as r) {
  <div class="layout" [style.grid-template-columns]="sidebarGridTemplate()">
    <aside class="sidebar">
      <app-day-panel
        [route]="r"
        [view]="view()"
        [focusedWaypointId]="focusedWaypointId()"
        [lang]="lang()"
        (viewChange)="onViewChange($event)"
        (focusWaypoint)="onFocusWaypoint($event)"
        (langChange)="setLang($event)"
      />
    </aside>
    <div
      class="splitter"
      [class.dragging]="dragging()"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize planning panel (drag or double-click to cycle sizes)"
      title="Drag to resize · double-click to cycle sizes"
      (pointerdown)="onSplitterPointerDown($event)"
      (dblclick)="onSplitterDblClick()"
    ></div>
    <main class="map-host">
      <app-map
        [route]="r"
        [selectedDay]="mapSelectedDay()"
        [focusedWaypointId]="focusedWaypointId()"
        [lang]="lang()"
        (waypointClicked)="onFocusWaypoint($event)"
      />
    </main>
  </div>
}
